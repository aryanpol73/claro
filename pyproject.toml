[project]
name = "claro"
version = "1.0.0"
description = "Claro - AI-Powered Academic Research Assistant & Cite-or-Refuse RAG Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-text-splitters>=1.1.2",
    "pinecone>=10.0.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "groq>=0.37.0",
    "langchain-groq>=1.1.0",
    "fastembed>=0.9.0",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
